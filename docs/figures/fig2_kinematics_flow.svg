   <g id="text_2">
    <text style="fill: #1f2933; font: 700 10px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="202.5" y="22.719527" transform="rotate(-0 202.5 22.719527)">齐次矩阵与对偶四元数运动学计算流程</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(39.824625 51.023145)">URDF 局部关节链</text>
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(47.47275 60.403645)">原点 + 旋转轴</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(175.3875 51.023145)">等效 MDH 变换</text>
    <!-- $T_i(q_i)$ -->
    <g style="fill: #1f2933" transform="translate(192.62 60.403645)">
     <text>
      <tspan style="font: oblique 8px 'DejaVu Sans'" x="0 9.782422" y="-0.921875">Tq</tspan>
      <tspan style="font: oblique 5.6px 'DejaVu Sans'" x="4.886719 14.860547" y="0.390625">ii</tspan>
      <tspan style="font: 8px 'DejaVu Sans'" x="6.661328 16.635156" y="-0.921875">()</tspan>
     </text>
    </g>
   </g>
   <g id="text_5">
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(319.359125 46.817395)">FK 矩阵</text>
    <!-- $T=\prod_i T_i$ -->
    <g style="fill: #1f2933" transform="translate(319.231 58.329395)">
     <text>
      <tspan style="font: oblique 8px 'DejaVu Sans'" x="0 21.535156" y="-0.859375">TT</tspan>
      <tspan style="font: 8px 'DejaVu Sans'" x="6.445312" y="-0.859375">=</tspan>
      <tspan style="font: 8px 'DejaVu Sans Display'" x="14.707031" y="-0.859375">∏</tspan>
      <tspan style="font: oblique 5.6px 'DejaVu Sans'" x="17.707031 26.421875" y="7.067187499999999 0.453125">ii</tspan>
     </text>
    </g>
   </g>
   <g id="text_6">
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(104.192 105.686985)">对偶四元数转换</text>
    <!-- $Q_i=q_r+\varepsilon q_d$ -->
    <g style="fill: #1f2933" transform="translate(107.912 115.067485)">
     <text>
      <tspan style="font: oblique 8px 'DejaVu Sans'" x="0 17.891797 35.311328 39.635547" y="-0.0625">Qqεq</tspan>
      <tspan style="font: oblique 5.6px 'DejaVu Sans'" x="6.296875 22.969922 44.713672" y="1.25">ird</tspan>
      <tspan style="font: 8px 'DejaVu Sans'" x="9.630078 27.049609" y="-0.0625">=+</tspan>
     </text>
    </g>
   </g>
   <g id="text_7">
    <text style="fill: #1f2933; font: 700 8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(246.816125 105.686985)">对偶四元数 FK</text>
    <!-- $Q=Q_1\otimes\cdots\otimes Q_n$ -->
    <g style="fill: #1f2933" transform="translate(240.848 115.067485)">
     <text>
      <tspan style="font: oblique 8px 'DejaVu Sans'" x="0 16.117188 53.836328" y="-0.0625">QQQ</tspan>
      <tspan style="font: 8px 'DejaVu Sans'" x="7.855469 27.754297 36.016016 45.574609" y="-0.0625">=⊗⋯⊗</tspan>
      <tspan style="font: 5.6px 'DejaVu Sans'" x="22.414062" y="1.25">1</tspan>
      <tspan style="font: oblique 5.6px 'DejaVu Sans'" x="60.133203" y="1.25">n</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="fill: #1f2933; font: 7.5px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(117.192 157.566838)">位姿残差</text>
    <text style="fill: #1f2933; font: 7.5px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(98.430281 166.448244)">位置误差 + 姿态误差</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f2933; font: 6.4px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(259.845 157.54156)">DLS 更新</text>
    <!-- $\Delta q=-J^T(JJ^T+\lambda^2I)^{-1}e$ -->
    <g style="fill: #1f2933" transform="translate(238.12 165.84996)">
     <text>
      <tspan style="font: 6.4px 'DejaVu Sans'" x="0 9.6733 17.518039 29.357723 40.220707 55.984363" y="-0.22500000000000053">Δ=−(+)</tspan>
      <tspan style="font: oblique 6.4px 'DejaVu Sans'" x="4.371704 24.117731 31.850933 33.735668 46.820398 54.099628 65.308206" y="-0.22500000000000053">qJJJλIe</tspan>
      <tspan style="font: oblique 4.48px 'DejaVu Sans'" x="26.450174 36.068111" y="-2.6750000000000003">TT</tspan>
      <tspan style="font: 4.48px 'DejaVu Sans'" x="51.078496 58.538823 62.287074" y="-2.6750000000000003">2−1</tspan>
     </text>
    </g>
   </g>
   <g id="text_10">
    <text style="fill: #667085; font: 6.8px 'Noto Sans CJK JP', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="202.5" y="185.656055" transform="rotate(-0 202.5 185.656055)">核心结论：对偶四元数是等价的 SE(3) 表示，URDF 对齐的 MDH 链仍是建模依据。</text>
   </g>
  </g>
